name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Ensure Supabase Config exists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p lib/config
          if [ ! -f lib/config/supabase_config.dart ]; then
            URL="${SUPABASE_URL:-https://kkyqghphrvnfycukwpyk.supabase.co}"
            KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtreXFnaHBocnZuZnljdWt3cHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTIwMDQsImV4cCI6MjA5NDE2ODAwNH0.0-YLNAcZG1U4ZL6Nrz0EdY4_Dioaq4C7sEy-VhWDtaA}"
            printf "class SupabaseConfig {\n  static const String url = '%s';\n  static const String anonKey = '%s';\n}\n" "$URL" "$KEY" > lib/config/supabase_config.dart
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendly-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Spendly ${{ github.ref_name }}
          body: |
            ## 💰 Spendly Release ${{ github.ref_name }}

            Aplikasi Pengelola Keuangan Pribadi berbasis Flutter dan Supabase.

            ### 📱 Cara Instalasi:
            1. Unduh file **`app-release.apk`** di bagian **Assets** di bawah.
            2. Buka file di HP Android Anda dan klik **Install**.

            ---
            *Dikembangkan oleh Tim Spendly - Tubes SAB UNPAS 2026*
          draft: false
          prerelease: false
          generate_release_notes: false
